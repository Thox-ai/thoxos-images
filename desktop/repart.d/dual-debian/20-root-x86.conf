# Desktop Edition root: 48 GiB class (DESIGN.md section 2), btrfs, label
# THOXOS-X86 like every other ThoxOS x86 root.
[Partition]
Type=root-x86-64
Label=THOXOS-X86
Format=btrfs
SizeMinBytes=48G
SizeMaxBytes=48G
CopyFiles=/x86/:/
ExcludeFiles=/x86/boot/
ExcludeFiles=/x86/var/lib/thox/
GrowFileSystem=on
