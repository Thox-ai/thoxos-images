# Desktop Edition (Debian) ESP: systemd-boot + x86_64 UKIs, plus the aarch64
# kernel/initrd/dtb tree slot and a best-effort BOOTAA64.EFI U-Boot stub
# (unverified on hardware), mirroring the dual layout. The partition label
# is THOXESP, matching the dual-boot installer (thox-install.sh) and the
# Desktop Edition fstab.
[Partition]
Type=esp
Label=THOXESP
Format=vfat
SizeMinBytes=1G
SizeMaxBytes=1G
CopyFiles=/x86/boot/:/
CopyFiles=/arm/esp/:/
