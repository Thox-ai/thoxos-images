# ThoxOS Desktop Edition: Debian 13 (trixie) root with KDE Plasma 6.3 (mkosi 27).
#
# The Debian counterpart of image/x86_64/mkosi.conf. The output is a
# directory tree; image/layout (layout dual-debian) turns it into the GPT
# disk image with systemd-repart, exactly like the Arch roots. The extra
# tree (common overlay + Debian desktop overlay + generated TXF themes) is
# assembled by image/scripts/build-debian.sh and passed with --extra-tree=.
# Vendor stacks (NVIDIA driver, VS Code, Tailscale, nvidia-container-
# toolkit) are installed in the main mkosi transaction: the vendor-apt
# tree (sources, keyrings, and a per-package exact-version pin set) is
# passed as a PackageManagerTree, and mkosi.postinst removes the vendor
# apt configuration again before the root is finished, so the shipped
# root carries no vendor apt sources. (The mkosi postinst sandbox has no
# usable network, which is why the vendor installs cannot run there; the
# apt solver also needs the exact-version pins to assemble one driver
# branch, because the branch packages interlock with = dependencies.)
#
# NVIDIA branch: the spec'd 570 branch (570.211.01-1, pinned and proven
# installable as a set) cannot be used: its open kernel module does not
# compile against trixie's 6.12 headers (nv-pci.c calls
# pci_resize_resource() with the pre-6.12.y-stable-backport signature;
# error reproduced in a container and in the first full build attempt).
# Per the brief's fallback rule, the strongest working configuration is
# shipped instead: the current production branch from the same repo,
# 580.196.07-1, whose open module builds cleanly against the shipped
# kernel (all five .ko verified in a container before this build).
#
# Every package name below was verified against trixie apt on 2026-10-25
# (see docs/validation/vm-review-x86_64-desktop-debian-2026-10-25.md for the
# substitution table: appmenu-gtk3-module for appmenu-gtk-module, gdisk for
# gptfdisk, and the rustup package conflicts with rustc/cargo in trixie so the
# rustup binary is vendored in mkosi.postinst (same pattern as uv). Also:
# gptfdisk, ntfs-3g ships the ntfsprogs tools in Debian, libreoffice-plasma
# and libreoffice-kf6 for the dropped libreoffice-kde-plasma).

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=contrib,non-free,non-free-firmware
RepositoryKeyCheck=yes

[Output]
Format=directory
ImageId=thoxos-debian
CompressOutput=no
ManifestFormat=json

[Build]
WithNetwork=yes

[Content]
# systemd-boot and the UKIs are produced by mkosi.postinst with
# initramfs-tools + systemd-ukify, mirroring the Arch postinst contract.
# vendor-apt is copied next to this file by build-debian.sh before mkosi
# runs; it carries the build-time-only vendor apt configuration.
PackageManagerTrees=vendor-apt
Bootable=no
Bootloader=none
UnifiedKernelImages=no
Hostname=thoxos
Locale=en_US.UTF-8
LocaleMessages=en_US.UTF-8
Keymap=us
Timezone=UTC
# WithDocs stays enabled: mkosi's doc path-exclusions break Debian
# maintainer scripts that register man-page alternatives (observed:
# openjdk-21-jre-headless, a LibreOffice dependency, failed to configure
# with WithDocs=no in the first full build attempt), and a development
# workstation wants its man pages.
WithDocs=yes
Packages=
    systemd
    systemd-sysv
    udev
    dbus
    locales
    tzdata
    sudo
    bash-completion
    linux-image-amd64
    linux-headers-amd64
