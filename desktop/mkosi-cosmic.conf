# ThoxOS Desktop Edition, COSMIC variant: Debian 13 (trixie) root with
# COSMIC Epoch 1.8.0 (mkosi 27). DESIGN.md section 12 is the contract:
# COSMIC is the adopted stack, the Plasma variant (mkosi.conf) is the
# fallback. The desktop packages come from the Synex apt repository,
# mirrored at build time into a vendored .deb pool (the synex-apt
# PackageManagerTree assembled by image/scripts/build-debian.sh); the
# image carries no Synex source and needs no network. Everything else
# (base, dev stack, vendor stacks, boot) matches the Plasma variant:
# vendor stacks (NVIDIA driver, VS Code, Tailscale, nvidia-container-
# toolkit) install in the main mkosi transaction from the vendor-apt
# tree, and mkosi-cosmic.postinst removes the vendor apt configuration
# and the .deb pool again before the root is finished. (The mkosi
# postinst sandbox has no usable network, which is why the vendor
# installs cannot run there; the apt solver also needs the exact-version
# pins to assemble one driver branch, because the branch packages
# interlock with = dependencies.)
#
# NVIDIA branch: the spec'd 570 branch (570.211.01-1, pinned and proven
# installable as a set) cannot be used: its open kernel module does not
# compile against trixie's 6.12 headers (nv-pci.c calls
# pci_resize_resource() with the pre-6.12.y-stable-backport signature;
# error reproduced in a container and in the first full build attempt).
# Per the brief's fallback rule, the strongest working configuration is
# shipped instead: the current production branch from the same repo,
# 580.196.07-1, whose open module builds cleanly against the shipped
# kernel (all five .ko verified in a container before this build).
#
# Every package name below was verified against trixie apt on 2026-10-25
# (see docs/validation/vm-review-x86_64-desktop-debian-2026-10-25.md for the
# substitution table: appmenu-gtk3-module for appmenu-gtk-module, gdisk for
# gptfdisk, and the rustup package conflicts with rustc/cargo in trixie so the
# rustup binary is vendored in mkosi.postinst (same pattern as uv). Also:
# gptfdisk, ntfs-3g ships the ntfsprogs tools in Debian, libreoffice-plasma
# and libreoffice-kf6 for the dropped libreoffice-kde-plasma).

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=contrib,non-free,non-free-firmware
RepositoryKeyCheck=yes

[Output]
Format=directory
ImageId=thoxos-debian
CompressOutput=no
ManifestFormat=json

[Build]
WithNetwork=yes

[Content]
# systemd-boot and the UKIs are produced by mkosi-cosmic.postinst with
# initramfs-tools + systemd-ukify, wired per DESIGN.md section 8 /
# KERNEL.md (kernel-install layout=uki declared in /etc/kernel, UKI
# carries the TXF .splash BMP, Type #2 entries under EFI/Linux).
# vendor-apt and synex-apt are copied next to this file by
# build-debian.sh before mkosi runs; both carry build-time-only apt
# configuration (vendor sources/keyrings/pins, and the local Synex pool).
PackageManagerTrees=vendor-apt,synex-apt
Bootable=no
Bootloader=none
UnifiedKernelImages=no
Hostname=thoxos
Locale=en_US.UTF-8
LocaleMessages=en_US.UTF-8
Keymap=us
Timezone=UTC
# WithDocs stays enabled: mkosi's doc path-exclusions break Debian
# maintainer scripts that register man-page alternatives (observed:
# openjdk-21-jre-headless, a LibreOffice dependency, failed to configure
# with WithDocs=no in the first full build attempt), and a development
# workstation wants its man pages.
WithDocs=yes
Packages=
    systemd
    systemd-sysv
    udev
    dbus
    locales
    tzdata
    sudo
    bash-completion
    linux-image-amd64
    linux-headers-amd64
    firmware-linux
    firmware-iwlwifi
    firmware-realtek
    firmware-atheros
    firmware-mediatek
    firmware-misc-nonfree
    firmware-sof-signed
    alsa-ucm-conf
    alsa-utils
    fwupd
    nvme-cli
    smartmontools
    lm-sensors
    btrfs-progs
    dosfstools
    e2fsprogs
    gdisk
    ntfs-3g
    efibootmgr
    initramfs-tools
    systemd-ukify
    systemd-boot-efi
    cryptsetup
    network-manager
    wpasupplicant
    bluez
    pipewire
    pipewire-pulse
    pipewire-alsa
    wireplumber
    # COSMIC Epoch 1.8.0+synex1 desktop (DESIGN.md section 12), from the
    # vendored Synex pool. greetd (trixie) hosts cosmic-greeter. COSMIC
